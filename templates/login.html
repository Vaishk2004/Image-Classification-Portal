<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In | Image Classification Portal</title>
  <link rel="stylesheet" href="{{ url_for('asset_file', filename='style.css') }}" />
</head>
<body>
  <header class="navbar">
    <nav class="nav-links" aria-label="Main navigation">
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('register') }}">Register</a>
      <a class="primary-link" href="{{ url_for('login') }}">Log In</a>
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
    </nav>
  </header>

  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-header">
        <h1>Log In</h1>
        <p>Use your registered email address and password.</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="messages" aria-live="polite">
            {% for category, message in messages %}
              <div class="message {{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form class="auth-form" method="POST" action="{{ url_for('login') }}" novalidate>
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          value="{{ form_data.email }}"
          placeholder="Enter your email address"
          required
        />

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          required
        />

        <button type="submit">Log In</button>
      </form>

      <p class="auth-switch">
        Do not have an account?
        <a href="{{ url_for('register') }}">Register</a>
      </p>
    </section>
  </main>
</body>
</html>

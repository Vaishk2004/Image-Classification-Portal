<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Classification Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
      background:
        linear-gradient(rgba(9, 20, 38, 0.62), rgba(9, 20, 38, 0.62)),
        url("OIP.jpeg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .navbar {
      width: 100%;
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 7%;
      background: rgba(8, 20, 39, 0.72);
      border-bottom: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(8px);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav-links a {
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 6px;
      transition: 0.2s ease;
    }

    .nav-links a:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .nav-links .primary-link {
      background: #2563eb;
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.3);
    }

    .nav-links .primary-link:hover {
      background: #1d4ed8;
    }

    .hero {
      min-height: calc(100vh - 76px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .hero-content {
      max-width: 820px;
    }

    h1 {
      font-size: clamp(42px, 7vw, 78px);
      line-height: 1.08;
      font-weight: 800;
      letter-spacing: 0;
      text-shadow: 0 16px 38px rgba(0, 0, 0, 0.4);
    }

    .subtitle {
      margin-top: 18px;
      font-size: clamp(17px, 2vw, 22px);
      color: #e6edf7;
      text-shadow: 0 10px 26px rgba(0, 0, 0, 0.35);
    }

    @media (max-width: 700px) {
      .navbar {
        justify-content: center;
        padding: 14px 18px;
      }

      .nav-links {
        width: 100%;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
      }

      .nav-links a {
        padding: 9px 12px;
        font-size: 14px;
      }

      .hero {
        min-height: calc(100vh - 134px);
      }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <nav class="nav-links" aria-label="Main navigation">
      <a class="primary-link" href="#">Register</a>
      <a href="#">Log In</a>
      <a href="#">Dashboard</a>
    </nav>
  </header>

  <main class="hero">
    <section class="hero-content">
      <h1>Image Classification Portal</h1>
    </section>
  </main>
</body>
</html>
